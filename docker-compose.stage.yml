version: '3.8'

services:
  mysql_stage:
    image: mysql:8.0
    container_name: csapp_mysql_stage
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-csapp_db_stage}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_stage:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - csapp_network_stage

  email_service:
    build:
      context: ./apps/email
      dockerfile: Dockerfile
    container_name: csapp_email_stage
    ports:
      - "127.0.0.1:9091:9090"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - csapp_network_stage

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: csapp_api_stage
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      DB_HOST: mysql_stage
      DB_NAME: ${DB_NAME:-csapp_db_stage}
      EMAIL_API_URL: http://email_service:9090
    depends_on:
      mysql_stage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - csapp_network_stage

networks:
  csapp_network_stage:
    driver: bridge

volumes:
  mysql_data_stage:
